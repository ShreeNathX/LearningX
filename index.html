<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LearningX is a distraction-free platform to practise Python, DSA, and SQL interview challenges in your browser." />
    <title>LearningX | Python, DSA & SQL Practice</title>
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Pyodide CDN for client-side Python 3 execution in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js" defer></script>
  </head>
  <body class="bg-dark text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-300">
    <div id="boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:Inter,system-ui,sans-serif;background:#0a0e17;color:#94a3b8;">
      <div style="width:36px;height:36px;border:3px solid #38bdf8;border-top-color:transparent;border-radius:50%;animation:lx-spin 0.8s linear infinite;"></div>
      <p style="font-size:14px;margin:0;">Loading LearningX…</p>
      <p style="font-size:11px;margin:0;opacity:0.7;">First load may take a few seconds</p>
    </div>
    <div id="root"></div>
    <style>@keyframes lx-spin { to { transform: rotate(360deg); } }</style>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0e17;color:#f8fafc;font-family:Inter,system-ui,sans-serif;">' +
          '<div style="max-width:520px;text-align:center;line-height:1.6;">' +
          '<h1 style="font-size:1.25rem;margin:0 0 12px;color:#38bdf8;">Cannot open LearningX as a file</h1>' +
          '<p style="margin:0 0 16px;color:#94a3b8;font-size:14px;">This app must run through the Vite dev server, not by double-clicking <code>index.html</code>.</p>' +
          '<p style="margin:0;font-size:13px;color:#64748b;">In the project folder run: <code style="color:#e2e8f0;">npm run dev</code> then open the URL shown (e.g. http://localhost:5173).</p>' +
          '</div></div>';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
